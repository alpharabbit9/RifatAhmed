<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Samstop UK LTD">
  <title>Samstop UK LTD</title>
  <!--
    Placeholder brand mark for the Samstop UK LTD career entry.
    Drawn in the portfolio palette (Design_System.md §2) so it sits inside the
    timeline card without fighting it: burgundy tile, cream monogram, and a
    dashed ring that reads as a passport/visa stamp — the company's trade.
    Everything is geometry (no <text>), so it renders identically everywhere,
    and it is replaceable from /admin/career-journey by uploading a real logo.
  -->
  <defs>
    <linearGradient id="samstop-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#741522" />
      <stop offset="1" stop-color="#3B0A10" />
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="24" fill="url(#samstop-tile)" />
  <rect x="4.5" y="4.5" width="87" height="87" rx="20" fill="none" stroke="#F8F1E7" stroke-opacity="0.22" />

  <!-- Stamp ring -->
  <circle cx="48" cy="46" r="30" fill="none" stroke="#F8F1E7" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 7" />

  <!-- "S" monogram, kept clear of the stamp ring -->
  <g transform="translate(48 46) scale(0.86) translate(-48 -46)">
  <path
    d="M62 33.5C62 27 55.5 23.5 48 23.5C40.5 23.5 34.5 27.5 34.5 33.5C34.5 45 62 42 62 55.5C62 62.5 55 68.5 47 68.5C39.5 68.5 34 65 33 59.5"
    fill="none" stroke="#F8F1E7" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Baseline rule -->
  <rect x="36" y="80" width="24" height="3" rx="1.5" fill="#F8F1E7" fill-opacity="0.5" />
</svg>
